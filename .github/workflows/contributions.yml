name: contributions

on:
  schedule:
    - cron: "23 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributions
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build contribution graph
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GH_LOGIN: pandistic-zain
        run: node scripts/build-contributions.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i -E "s#(contributions\.svg\?v=)[0-9A-Za-z-]+#\1$(date -u +%Y%m%d)#" README.md
          git add assets/contributions.svg README.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: sync contribution graph"
            git push
          fi
